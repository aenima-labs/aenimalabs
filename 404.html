		.lost { position: relative; min-height: 100svh; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 48px 24px; text-align: center; background: var(--navy-deep); color: var(--white); overflow: hidden; isolation: isolate; }

		.lost-orbit .ring { position: absolute; }
		.lost-orbit .ring::before { content: ""; position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--sage-light); box-shadow: 0 0 14px var(--sage-light); }
		.lost-orbit .ring-2::before { background: var(--copper); box-shadow: 0 0 14px var(--copper); }
		.lost h1 { font-size: clamp(40px, 7vw, 72px); font-weight: 600; letter-spacing: -.04em; line-height: 1; }
		.lost p { margin: 0; max-width: 420px; font-family: var(--serif); font-style: italic; font-size: 21px; color: var(--on-dark); }
		.lost .brand-mark { width: 56px; height: 56px; }
		.lost .brand-mark svg { width: 26px; height: 26px; }
	</style>
</head>

		<span class="brand-mark" aria-hidden="true"><svg><use href="#ae"/></svg></span>
